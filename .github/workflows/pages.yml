name: CI/CD da landing page

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar JavaScript e links internos
        run: |
          node --check script.js
          node --test tests/site.test.mjs
      - name: Preparar site para publicação
        if: github.event_name == 'push'
        run: |
          mkdir _site
          cp index.html style.css script.js CNAME _site/
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
